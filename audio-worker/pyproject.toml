[project]
name = "wpe-worker"
version = "0.1.0"
description = "Local audio preparation worker for Worship Playback Engine (separation, analysis, rendering)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3; platform_machine == 'arm64'",
    "numpy>=1.26,<2; platform_machine == 'x86_64'",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "demucs>=4.1.0",
    "torch>=2.6; platform_machine == 'arm64'",
    "torch==2.2.2; platform_machine == 'x86_64'",
    "onnxruntime>=1.19,<1.24",
    "demucs-mlx>=1.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpe_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
