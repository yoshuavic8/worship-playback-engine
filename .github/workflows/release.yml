# Unsigned macOS universal build.
# Ad-hoc signed (signingIdentity "-") so Gatekeeper does not call the app "damaged".
# Users still allow it once: right-click → Open, or Privacy & Security → Open Anyway.
#
# Trigger:
#   - Actions → Release → Run workflow  → download the artifact
#   - add docs/releases/vX.Y.Z.md, then git tag vX.Y.Z && git push origin vX.Y.Z  → GitHub Release with the .dmg

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Fetch bundled sidecars (uv + static LGPL ffmpeg)
        run: |
          chmod +x scripts/fetch-sidecars.sh scripts/build-ffmpeg-lgpl.sh
          bash scripts/fetch-sidecars.sh

      - name: Build DMG
        working-directory: apps/desktop
        run: npm run build:mac

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          find apps/desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -exec cp {} dist-artifacts/ \;
          ls -lh dist-artifacts
          ls dist-artifacts/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: dist-artifacts/*.dmg
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.dmg
          # Release notes live in docs/releases/<tag>.md
          body_path: docs/releases/${{ github.ref_name }}.md
